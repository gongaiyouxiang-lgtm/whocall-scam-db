name: flutter_2048
description: "2048 tile game with save/resume and background music support."
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  # To enable background music, place your audio file at assets/music/bg_loop.mp3
  # then uncomment the lines below:
  # assets:
  #   - assets/music/bg_loop.mp3
